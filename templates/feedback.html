<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Police - Service Rating & Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', 'Noto Sans Ethiopic', sans-serif;
            background: radial-gradient(circle at center, #172554, #0f172a, #020617);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes professionalFadeIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .page-enter {
            animation: professionalFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.95);
        }

        @keyframes ultraSmoothDrop {
            0% { opacity: 0; transform: translateY(-140px) scale(0.75); }
            60% { opacity: 0.8; transform: translateY(15px) scale(1.03); }
            85% { opacity: 1; transform: translateY(-6px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .drop-anim-1 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.25s both; }
        .drop-anim-2 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.40s both; }
        .drop-anim-3 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.55s both; }
        .drop-anim-4 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.70s both; }
        .drop-anim-5 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.85s both; }

        .rating-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(251, 191, 36, 0.2);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
        }

        .rating-card.selected {
            border-color: #fbbf24;
            background: linear-gradient(145deg, rgba(37, 99, 235, 0.65), rgba(15, 23, 42, 0.99));
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.7);
            transform: translateY(-15px) scale(1.08);
        }

        .rating-card:hover {
            transform: translateY(-15px) scale(1.08);
            border-color: #fbbf24;
            background: linear-gradient(145deg, rgba(37, 99, 235, 0.55), rgba(15, 23, 42, 0.99));
            box-shadow: 0 30px 60px -15px rgba(251, 191, 36, 0.5), 0 0 30px rgba(37, 99, 235, 0.8);
        }

        .rating-card:hover span.emoji, .rating-card.selected span.emoji {
            transform: scale(1.35) rotate(10deg);
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8));
        }

        span.emoji {
            display: inline-block;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.7s ease;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active {
            animation: pulseGlow 1.5s infinite;
            background-color: #dc2626 !important;
            border-color: #f87171 !important;
        }

        @keyframes smoothBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.15); }
        }
        .success-motion-icon {
            display: inline-block;
            animation: smoothBounce 2s ease-in-out infinite;
        }

        .voice-guide-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }

        .voice-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(251, 191, 36, 0.25);
            color: #e2e8f0;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .voice-btn:hover {
            background: rgba(37, 99, 235, 0.4);
            border-color: #fbbf24;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
        }
    </style>
</head>
<body class="page-enter" id="body-content">

    <div class="text-center mb-5">
        <h1 id="hdr-title" class="text-xl md:text-2xl font-extrabold text-amber-400 mb-1 tracking-wider">የኢትዮጵያ ፌዴራል ፖሊስ</h1>
        <p id="hdr-sub" class="text-xs text-gray-300 font-medium tracking-wide">Ethiopian Federal Police Service Feedback System</p>
    </div>

    <div class="glass-panel p-6 md:p-10 rounded-3xl w-full max-w-4xl text-center">
        <h2 id="main-heading" class="text-lg md:text-xl font-extrabold mb-2 text-amber-300 tracking-wide">
            በተሰጠዎት አገልግሎት ምን ያህል ረክተዋል?
        </h2>
        <p id="main-desc" class="text-xs text-gray-300 mb-6 max-w-lg mx-auto leading-relaxed">
            እባክዎ የተሰማዎትን እርካታ ከታች ከሚገኙት ስሜቶች አንዱን በመምረጥ በዝግታ ይግለጹን።
        </p>

        <!-- የሬቲንግ ኢሞጂዎች -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div onclick="selectRating('1')" id="rate-1" class="rating-card drop-anim-1 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😡</span>
                <span class="lbl-1 font-bold text-xs text-white tracking-wide">በጣም አላረኩም</span>
            </div>
            <div onclick="selectRating('2')" id="rate-2" class="rating-card drop-anim-2 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">🙁</span>
                <span class="lbl-2 font-bold text-xs text-white tracking-wide">አላረኩም</span>
            </div>
            <div onclick="selectRating('3')" id="rate-3" class="rating-card drop-anim-3 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😐</span>
                <span class="lbl-3 font-bold text-xs text-white tracking-wide">መካከለኛ</span>
            </div>
            <div onclick="selectRating('4')" id="rate-4" class="rating-card drop-anim-4 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😊</span>
                <span class="lbl-4 font-bold text-xs text-white tracking-wide">ረክቻለሁ</span>
            </div>
            <div onclick="selectRating('5')" id="rate-5" class="rating-card drop-anim-5 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😍</span>
                <span class="lbl-5 font-bold text-xs text-white tracking-wide">በጣም ረክቻለሁ</span>
            </div>
        </div>

        <!-- አስተያየት እና የድምጽ መቅረጫ -->
        <div class="mb-6 text-left space-y-3">
            <div>
                <label id="lbl-comment" class="block text-xs font-semibold text-gray-300 mb-1">አስተያየትዎን በጽሁፍ ይጻፉ (አማራጭ):</label>
                <textarea id="user-comment" rows="2" placeholder="ስለተሰጠው አገልግሎትዎ ሃሳብ ወይም አስተያየት ይጻፉ..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-400 transition-all"></textarea>
            </div>

            <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-3">
                    <button type="button" id="record-btn" onclick="toggleRecording()" class="bg-slate-800 hover:bg-slate-700 text-white w-9 h-9 rounded-full flex items-center justify-center border border-slate-600 transition-all">
                        <i id="mic-icon" class="fa-solid fa-microphone text-amber-400 text-sm"></i>
                    </button>
                    <div>
                        <span id="record-status" class="text-xs font-semibold text-gray-300 block">ድምጽ ለመቅረጽ ማይኩን ይጫኑ</span>
                    </div>
                </div>
                <div id="audio-preview-container" class="hidden">
                    <audio id="audio-playback" controls class="h-7 w-36 md:w-44"></audio>
                </div>
            </div>
        </div>

        <div id="alert-box" class="hidden mb-4 p-3.5 bg-red-950/85 border border-red-500 text-red-200 text-xs rounded-xl flex items-center space-x-3 text-left shadow-lg">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg shrink-0"></i>
            <span id="alert-text" class="font-medium leading-relaxed"></span>
        </div>

        <div class="flex items-center justify-between mb-4">
            <button onclick="goBack()" class="bg-slate-800/90 hover:bg-slate-700 text-gray-300 font-semibold px-4 py-2 rounded-xl border border-slate-600 transition-all duration-500 flex items-center space-x-2 text-xs hover:scale-105">
                <i class="fa-solid fa-arrow-left"></i>
                <span id="btn-back">ወደ አገልግሎቶች ተመለስ</span>
            </button>
            <button onclick="validateAndSubmit()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-6 py-2 rounded-xl text-xs transition-all shadow-lg flex items-center space-x-2 hover:scale-105">
                <span id="btn-submit">አስገባና ጨርስ</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Voice Guide Section -->
        <div class="voice-guide-container">
            <button onclick="playVoiceGuide('Please select your satisfaction rating, and write your comments below.', 'en')" class="voice-btn">
                🔊 Instructions (English)
            </button>
            <button onclick="playVoiceGuide('እባክዎ የእርካታ ደረጃ ይምረጡ፣ እና አስተያየትዎን ከታች ይጻፉ።', 'am')" class="voice-btn">
                🔊 Instructions (Amharic)
            </button>
            <button onclick="playVoiceGuide('Maaloo sadarkaa quufaa keessan filadhaa, yaada keessanis gadiitti barreessaa.', 'om')" class="voice-btn">
                🔊 Instructions (Afaan Oromoo)
            </button>
            <button onclick="playVoiceGuide('ሕርያ ደረጃ ዕግበትኩም ምረጹ፣ ርእይቶኹም ድማ ኣብ ትሕቲ እቲ ጽሓፉ።', 'ti')" class="voice-btn">
                🔊 Instructions (Tigrinya)
            </button>
        </div>
    </div>

    <div id="success-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-500">
        <div class="glass-panel p-8 rounded-3xl text-center max-w-md mx-4 transform scale-90 transition-transform duration-500" id="success-card">
            <div class="text-3xl md:text-4xl font-extrabold text-emerald-400 mb-3 flex items-center justify-center space-x-3">
                <span id="success-title-text">thank you! 😊</span>
                <span class="success-motion-icon">✅</span>
            </div>
            <p id="success-msg-text" class="text-xs text-gray-200 font-medium leading-relaxed">
                your feedback has been submitted successfully
            </p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'am';
        const service = urlParams.get('service') || 'police_clearance';
        const subServiceParam = urlParams.get('sub_service') || urlParams.get('sub') || '';

        const translations = {
            am: {
                hdrTitle: "የኢትዮጵያ ፌዴራል ፖሊስ",
                hdrSub: "የዜጎች አስተያየት መስጫ ስርዓት",
                mainHeading: "በተሰጠዎት አገልግሎት ምን ያህል ረክተዋል?",
                mainDesc: "እባክዎ የተሰማዎትን እርካታ ከታች ከሚገኙት ስሜቶች አንዱን በመምረጥ በዝግታ ይግለጹን።",
                l1: "በጣም አላረኩም", l2: "አላረኩም", l3: "መካከለኛ", l4: "ረክቻለሁ", l5: "በጣም ረክቻለሁ",
                lblComment: "አስተያየትዎን በጽሁፍ ይጻፉ (አማራጭ):",
                commentPlaceholder: "ስለተሰጠው አገልግሎትዎ ሃሳብ ወይም አስተያየት ይጻፉ...",
                recStatus: "ድምጽ ለመቅረጽ ማይኩን ይጫኑ",
                recActive: "ድምጽ በመቅረጽ ላይ ነው...",
                recDone: "ድምጽዎ ተቀምጧል!",
                btnBack: "ተመለስ",
                btnSubmit: "አስገባና ጨርስ",
                errRating: "እባክዎ ከመቀጠልዎ በፊት የሬቲንግ ስሜት (Rating) ይምረጡ!",
                alertMismatch: "Your feedback is not the same with your rate! ‼️ (የሰጡት ሬቲንግ እና የጻፉት አስተያየት እርስ በእርስ ፈጽሞ አያጣምም።)",
                successTitle: "አመሰግናለሁ! 😊",
                successDesc: "አስተያየትዎ በተሳካ ሁኔታ ተመዝግቧል ✅"
            },
            en: {
                hdrTitle: "Ethiopian Federal Police",
                hdrSub: "Citizen Feedback System",
                mainHeading: "How satisfied are you with the service provided?",
                mainDesc: "Please gently select your satisfaction level from the options below.",
                l1: "Very Dissatisfied", l2: "Dissatisfied", l3: "Neutral", l4: "Satisfied", l5: "Very Satisfied",
                lblComment: "Write your comment (Optional):",
                commentPlaceholder: "Write your thoughts or feedback about the service...",
                recStatus: "Click mic to record voice",
                recActive: "Recording voice...",
                recDone: "Voice recorded!",
                btnBack: "Back",
                btnSubmit: "Submit & Finish",
                errRating: "Please select a rating before proceeding!",
                alertMismatch: "Your feedback is not the same with your rate! ‼️",
                successTitle: "thank you! 😊",
                successDesc: "your feedback has been submitted successfully ✅"
            }
        };

        const t = translations[lang] || translations['en'];

        document.getElementById('hdr-title').textContent = t.hdrTitle;
        document.getElementById('hdr-sub').textContent = t.hdrSub;
        document.getElementById('main-heading').textContent = t.mainHeading;
        document.getElementById('main-desc').textContent = t.mainDesc;
        document.querySelector('.lbl-1').textContent = t.l1;
        document.querySelector('.lbl-2').textContent = t.l2;
        document.querySelector('.lbl-3').textContent = t.l3;
        document.querySelector('.lbl-4').textContent = t.l4;
        document.querySelector('.lbl-5').textContent = t.l5;
        document.getElementById('lbl-comment').textContent = t.lblComment;
        document.getElementById('user-comment').placeholder = t.commentPlaceholder;
        document.getElementById('record-status').textContent = t.recStatus;
        document.getElementById('btn-back').textContent = t.btnBack;
        document.getElementById('btn-submit').textContent = t.btnSubmit;
        document.getElementById('success-title-text').textContent = t.successTitle;
        document.getElementById('success-msg-text').textContent = t.successDesc;

        let selectedScore = '';
        let hasVoiceRecorded = false;
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        function selectRating(score) {
            selectedScore = score;
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`rate-${i}`).classList.remove('selected');
            }
            document.getElementById(`rate-${score}`).classList.add('selected');
            document.getElementById('alert-box').classList.add('hidden');
        }

        function toggleRecording() {
            const recordBtn = document.getElementById('record-btn');
            const micIcon = document.getElementById('mic-icon');
            const recordStatus = document.getElementById('record-status');
            
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        document.getElementById('audio-playback').src = audioUrl;
                        document.getElementById('audio-preview-container').classList.remove('hidden');
                        hasVoiceRecorded = true;
                        document.getElementById('alert-box').classList.add('hidden');
                    };

                    isRecording = true;
                    recordBtn.classList.add('recording-active');
                    micIcon.classList.remove('fa-microphone', 'text-amber-400');
                    micIcon.classList.add('fa-stop', 'text-white');
                    recordStatus.textContent = t.recActive;
                }).catch(err => {
                    alert("Microphone permission denied or not available.");
                });
            } else {
                if (mediaRecorder) {
                    mediaRecorder.stop();
                }
                isRecording = false;
                recordBtn.classList.remove('recording-active');
                micIcon.classList.remove('fa-stop', 'text-white');
                micIcon.classList.add('fa-microphone', 'text-amber-400');
                recordStatus.textContent = t.recDone;
            }
        }

        function playVoiceGuide(text, langCode) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode === 'am' ? 'am-ET' : 
                                 langCode === 'om' ? 'om-ET' : 
                                 langCode === 'ti' ? 'ti-ER' : 'en-US';
                utterance.rate = 0.9;
                
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("Text-to-speech not supported in this browser.");
            }
        }

        function validateAndSubmit() {
            const alertBox = document.getElementById('alert-box');
            const alertText = document.getElementById('alert-text');

            if (!selectedScore) {
                alertText.textContent = t.errRating;
                alertBox.classList.remove('hidden');
                return;
            }

            const comment = document.getElementById('user-comment').value.trim().toLowerCase();
            
            const negativeKeywords = [
                'አላረኩም', 'መጥፎ', 'ክፉ', 'አይሰራም', 'ዘግዩ', 'ችግር', 'ደስ አላለኝም', 'አዘንኩኝ', 
                'bad', 'worst', 'poor', 'useless', 'terrible', 'hate', 'angry', 'not satisfied', 
                'disappointed', 'not good', 'it is not good', "it's not good", 'hin quufne', 'rakkoo'
            ];
            
            const positiveKeywords = [
                'ረክቻለሁ', 'አመሰግናለሁ', 'ጥሩ', 'አሪፍ', 'ፈጣን', 'ደስ ይላል', 
                'good', 'great', 'excellent', 'satisfied', 'happy', 'thank', 'wonderful', 'nice', 'quufeera', 'bayyee gaarii'
            ];

            let hasNegative = negativeKeywords.some(w => comment.includes(w));
            let hasPositive = positiveKeywords.some(w => comment.includes(w));

            if ((selectedScore === '4' || selectedScore === '5') && hasNegative) {
                alertText.textContent = t.alertMismatch;
                alertBox.classList.remove('hidden');
                return; 
            }

            if ((selectedScore === '1' || selectedScore === '2') && hasPositive && !hasNegative) {
                alertText.textContent = t.alertMismatch;
                alertBox.classList.remove('hidden');
                return; 
            }

            const emojiMap = {
                '1': '😡',
                '2': '🙁',
                '3': '😐',
                '4': '😊',
                '5': '😍'
            };
            const selectedEmoji = emojiMap[selectedScore] || '😊';

            alertBox.classList.add('hidden');

            fetch('/submit-feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    service: service,          
                    sub_service: subServiceParam || 'General Service',  
                    rating: selectedEmoji,         
                    comment: document.getElementById('user-comment').value
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Success:", data);
            })
            .catch((error) => {
                console.error("Error:", error);
            });

            const successModal = document.getElementById('success-modal');
            const successCard = document.getElementById('success-card');
            
            successModal.classList.remove('hidden');
            setTimeout(() => {
                successModal.style.opacity = '1';
                successCard.style.transform = 'scale(1)';
            }, 50);

            setTimeout(() => {
                window.location.href = `/?lang=${lang}`;
            }, 2500);
        }

        function goBack() {
            const body = document.getElementById('body-content');
            body.style.opacity = '0';
            body.style.transform = 'translateY(35px)';
            body.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
            setTimeout(() => {
                window.location.href = `/services?lang=${lang}&service=${service}`;
            }, 550);
        }
    </script>
</body>
</html>
