<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Police - Service Rating & Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', 'Noto Sans Ethiopic', sans-serif;
            background: radial-gradient(circle at center, #172554, #0f172a, #020617);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.light-mode {
            background: radial-gradient(circle at center, #eff6ff, #dbeafe, #bfdbfe);
            color: #0f172a;
        }

        @keyframes professionalFadeIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .page-enter {
            animation: professionalFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.95);
            position: relative;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(30, 58, 138, 0.3);
            box-shadow: 0 20px 50px -10px rgba(30, 58, 138, 0.15);
        }

        @keyframes ultraSmoothDrop {
            0% { opacity: 0; transform: translateY(-140px) scale(0.75); }
            60% { opacity: 0.8; transform: translateY(15px) scale(1.03); }
            85% { opacity: 1; transform: translateY(-6px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .drop-anim-1 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.25s both; }
        .drop-anim-2 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.40s both; }
        .drop-anim-3 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.55s both; }
        .drop-anim-4 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.70s both; }
        .drop-anim-5 { animation: ultraSmoothDrop 1.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.85s both; }

        .rating-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(251, 191, 36, 0.2);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
        }

        body.light-mode .rating-card {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 1px solid rgba(30, 58, 138, 0.2);
        }

        body.light-mode .rating-card span[class*="lbl-"] {
            color: #1e293b !important;
        }

        .rating-card.selected {
            border-color: #fbbf24;
            background: linear-gradient(145deg, rgba(37, 99, 235, 0.65), rgba(15, 23, 42, 0.99));
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.7);
            transform: translateY(-15px) scale(1.08);
        }

        body.light-mode .rating-card.selected {
            background: linear-gradient(145deg, #3b82f6, #1d4ed8);
            border-color: #1e40af;
        }

        body.light-mode .rating-card.selected span[class*="lbl-"] {
            color: #ffffff !important;
        }

        .rating-card:hover {
            transform: translateY(-15px) scale(1.08);
            border-color: #fbbf24;
            background: linear-gradient(145deg, rgba(37, 99, 235, 0.55), rgba(15, 23, 42, 0.99));
            box-shadow: 0 30px 60px -15px rgba(251, 191, 36, 0.5), 0 0 30px rgba(37, 99, 235, 0.8);
        }

        body.light-mode .rating-card:hover {
            background: linear-gradient(145deg, #60a5fa, #2563eb);
            border-color: #1d4ed8;
        }

        body.light-mode .rating-card:hover span[class*="lbl-"] {
            color: #ffffff !important;
        }

        .rating-card:hover span.emoji, .rating-card.selected span.emoji {
            transform: scale(1.35) rotate(10deg);
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8));
        }

        span.emoji {
            display: inline-block;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.7s ease;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
        }

        .recording-active {
            animation: pulseGlow 1.5s infinite;
            background-color: #dc2626 !important;
            border-color: #f87171 !important;
        }

        @keyframes smoothBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.15); }
        }

        .success-motion-icon {
            display: inline-block;
            animation: smoothBounce 2s infinite ease-in-out;
        }

        .voice-guide-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }

        .voice-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(251, 191, 36, 0.25);
            color: #e2e8f0;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body.light-mode .voice-btn {
            background: #ffffff;
            border: 1px solid rgba(30, 58, 138, 0.3);
            color: #1e293b;
        }

        .voice-btn:hover {
            background: rgba(37, 99, 235, 0.4);
            border-color: #fbbf24;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
        }

        body.light-mode .voice-btn:hover {
            background: #2563eb;
            color: #ffffff;
        }

        body.light-mode #hdr-title { color: #1e3a8a; }
        body.light-mode #hdr-sub { color: #475569; }
        body.light-mode #main-heading { color: #1e3a8a; }
        body.light-mode #main-desc { color: #475569; }
        body.light-mode #lbl-comment { color: #334155; }
        body.light-mode #user-comment {
            background-color: #ffffff;
            color: #0f172a;
            border-color: #cbd5e1;
        }
        body.light-mode #record-btn {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: #334155;
        }
        body.light-mode #record-status { color: #334155; }
        body.light-mode .mic-container-bg {
            background-color: #f8fafc;
            border-color: #e2e8f0;
        }
        body.light-mode #btn-back {
            background-color: #e2e8f0;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        #theme-toggle {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        body.light-mode #theme-toggle {
            background: #ffffff;
            border-color: rgba(30, 58, 138, 0.4);
            color: #1e3a8a;
        }
    </style>
</head>

<body class="page-enter" id="body-content">

    <!-- Federal Police Logo -->
    <div class="flex justify-center mb-3">
        <div class="w-16 h-16 rounded-full bg-slate-900 border-2 border-amber-400/60 flex items-center justify-center shadow-lg shadow-amber-500/10 p-1.5">
            <img
                src="{{ url_for('static', filename='images/police_logo.png') }}"
                alt="Federal Police Logo"
                class="w-full h-full object-contain"
                onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/2/2b/Emblem_of_Ethiop3.png'"
            >
        </div>
    </div>

    <div class="text-center mb-5">
        <h1 id="hdr-title" class="text-xl md:text-2xl font-extrabold text-amber-400 mb-1 tracking-wider">
            የኢትዮጵያ ፌዴራል ፖሊስ
        </h1>
        <p id="hdr-sub" class="text-xs text-gray-300 font-medium tracking-wide">
            Ethiopian Federal Police Service Feedback System
        </p>
    </div>

    <div class="glass-panel p-6 md:p-10 rounded-3xl w-full max-w-4xl text-center">

        <!-- Dark / Light Mode Toggle -->
        <button
            id="theme-toggle"
            type="button"
            onclick="toggleTheme()"
            class="absolute top-4 right-4 text-amber-400 font-semibold px-3 py-1.5 rounded-xl transition-all duration-300 flex items-center space-x-2 shadow-md hover:scale-105 z-10 text-xs"
        >
            <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
            <span id="theme-text">Dark Mode</span>
        </button>

        <!-- Heading -->
        <div id="welcome-section" class="mb-6">
            <h2 id="main-heading" class="text-lg md:text-xl font-extrabold mb-2 text-amber-300 tracking-wide">
                በተሰጠዎት አገልግሎት ምን ያህል ረክተዋል?
            </h2>
            <p id="main-desc" class="text-xs text-gray-300 mb-6 max-w-lg mx-auto leading-relaxed">
                እባክዎ የተሰማዎትን እርካታ ከታች ከሚገኙት ስሜቶች አንዱን በመምረጥ በዝግታ ይግለጹን።
            </p>
        </div>

        <!-- Rating Emojis -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div onclick="selectRating('1')" id="rate-1" class="rating-card drop-anim-1 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😡</span>
                <span class="lbl-1 font-bold text-xs text-white tracking-wide">በጣም አላረኩም</span>
            </div>

            <div onclick="selectRating('2')" id="rate-2" class="rating-card drop-anim-2 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">🙁</span>
                <span class="lbl-2 font-bold text-xs text-white tracking-wide">አላረኩም</span>
            </div>

            <div onclick="selectRating('3')" id="rate-3" class="rating-card drop-anim-3 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😐</span>
                <span class="lbl-3 font-bold text-xs text-white tracking-wide">መካከለኛ</span>
            </div>

            <div onclick="selectRating('4')" id="rate-4" class="rating-card drop-anim-4 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😊</span>
                <span class="lbl-4 font-bold text-xs text-white tracking-wide">ረክቻለሁ</span>
            </div>

            <div onclick="selectRating('5')" id="rate-5" class="rating-card drop-anim-5 p-5 rounded-2xl flex flex-col items-center justify-center space-y-2">
                <span class="emoji text-4xl md:text-5xl">😍</span>
                <span class="lbl-5 font-bold text-xs text-white tracking-wide">በጣም ረክቻለሁ</span>
            </div>
        </div>

        <!-- Comment & Voice Recorder -->
        <div class="mb-6 text-left space-y-3">
            <div>
                <label id="lbl-comment" class="block text-xs font-semibold text-gray-300 mb-1">
                    አስተያየትዎን በጽሁፍ ይጻፉ (አማራጭ):
                </label>

                <textarea
                    id="user-comment"
                    rows="2"
                    placeholder="ስለተሰጠው አገልግሎትዎ ሃሳብ ወይም አስተያየት ይጻፉ..."
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-400 transition-all"
                ></textarea>
            </div>

            <div class="mic-container-bg flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-3">
                    <button
                        type="button"
                        id="record-btn"
                        class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl flex items-center space-x-2 border border-slate-600 transition-all text-xs"
                    >
                        <i id="mic-icon" class="fa-solid fa-microphone text-amber-400 text-sm"></i>
                        <span id="record-status" class="font-semibold text-gray-300">
                            ድምጽ ለመቅረጽ ማይኩን ይጫኑ
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Alert -->
        <div id="alert-box" class="hidden mb-4 p-3.5 bg-red-950/85 border border-red-500 text-red-200 text-xs rounded-xl flex items-center space-x-3 text-left shadow-lg">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg shrink-0"></i>
            <span id="alert-text" class="font-medium leading-relaxed"></span>
        </div>

        <!-- Navigation / Submit -->
        <div class="flex items-center justify-between mb-6">
            <button
                onclick="goBack()"
                id="btn-back-container"
                type="button"
                class="bg-slate-800/90 hover:bg-slate-700 text-gray-300 font-semibold px-4 py-2 rounded-xl border border-slate-600 transition-all duration-500 flex items-center space-x-2 text-xs hover:scale-105"
            >
                <i class="fa-solid fa-arrow-left"></i>
                <span id="btn-back">ወደ አገልግሎቶች ተመለስ</span>
            </button>

            <button
                onclick="validateAndSubmit()"
                type="button"
                class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl border border-amber-300/50 transition-all duration-300 flex items-center space-x-2 text-xs shadow-lg shadow-amber-500/20 hover:scale-105"
            >
                <span id="btn-submit">መዝግብ & ጨርስ</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <!-- Voice Guides -->
        <div class="voice-guide-container">
            <button
                type="button"
                onclick="playGttsGuide('እባክዎ የተሰማዎትን የእርካታ ደረጃ ይምረጡና አስተያየትዎን ያስቀምጡ።', 'am')"
                class="voice-btn"
            >
                <i class="fa-solid fa-volume-high text-amber-400"></i>
                Amharic Voice Guide
            </button>
            <button
                type="button"
                onclick="readFullUIEnglish()"
                class="voice-btn"
            >
                <i class="fa-solid fa-volume-high text-amber-400"></i>
                English Voice Guide
            </button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-500">
        <div id="success-card" class="bg-slate-900 border-2 border-amber-400/80 rounded-3xl p-8 max-w-sm w-full text-center transform scale-90 transition-transform duration-500 shadow-2xl">
            <div class="text-6xl mb-4 success-motion-icon">✨</div>
            <h3 id="success-title-text" class="text-xl font-bold text-amber-400 mb-2">እናመሰግናለን! 😊</h3>
            <p id="success-msg-text" class="text-xs text-gray-300 mb-6 leading-relaxed">
                አስተያየትዎ በጥሩ ሁኔታ ተመዝግቧል።
            </p>
        </div>
    </div>

    <script>
        /* -------------------------------------------------------
           URL PARAMETERS
        ------------------------------------------------------- */
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'am';
        const service = urlParams.get('service') || 'General';
        const subServiceParam = urlParams.get('sub_service') || '';

        /* -------------------------------------------------------
           TRANSLATIONS
        ------------------------------------------------------- */
        const translations = {
            en: {
                hdrTitle: "ETHIOPIAN FEDERAL POLICE",
                hdrSub: "Citizen Feedback Portal",
                mainHeading: "How satisfied are you with our service?",
                mainDesc: "Please take a moment to select your rating emoji below and share your thoughts.",
                l1: "Very Dissatisfied",
                l2: "Dissatisfied",
                l3: "Neutral",
                l4: "Satisfied",
                l5: "Very Satisfied",
                lblComment: "Write your feedback (Optional):",
                commentPlaceholder: "Type your comment or thoughts about the service here...",
                recStatus: "Click mic to record voice",
                recActive: "Listening...",
                btnBack: "Back to Services",
                btnSubmit: "Submit & Complete",
                errRating: "Please select a rating option before proceeding!",
                alertMismatch: "Your written comment contradicts the rating selected! ‼️",
                successTitle: "Thank You! 😊",
                successDesc: "Your feedback has been successfully recorded ✅"
            },

            am: {
                hdrTitle: "የኢትዮጵያ ፌዴራል ፖሊስ",
                hdrSub: "የህዝብ አስተያየት መቀበያ ስርዓት",
                mainHeading: "በተሰጠዎት አገልግሎት ምን ያህል ረክተዋል?",
                mainDesc: "እባክዎ የተሰማዎትን እርካታ ከታች ከሚገኙት ስሜቶች አንዱን በመምረጥ በዝግታ ይግለጹን።",
                l1: "በጣም አላረኩም",
                l2: "አረካሁም",
                l3: "መካከለኛ",
                l4: "ረክቻለሁ",
                l5: "በጣም ረክቻለሁ",
                lblComment: "አስተያየትዎን በጽሁፍ ይጻፉ (አማራጭ):",
                commentPlaceholder: "ስለተሰጠው አገልግሎትዎ ሃሳብ ወይም አስተያየት ይጻፉ...",
                recStatus: "ድምጽ ለመቅረጽ ማይኩን ይጫኑ",
                recActive: "እያዳመጠ ነው...",
                btnBack: "ወደ አገልግሎቶች ተመለስ",
                btnSubmit: "መዝግብ & ጨርስ",
                errRating: "እባክዎ አስቀድመው የእርካታ ደረጃዎን ይምረጡ!",
                alertMismatch: "የጻፉት አስተያየት ከሰጡት የእርካታ ደረጃ ጋር አይጣጣምም! ‼️",
                successTitle: "እናመሰግናለን! 😊",
                successDesc: "አስተያየትዎ በጥሩ ሁኔታ ተመዝግቧል ✅"
            },
        };

        const t = translations[lang] || translations.en;

        /* -------------------------------------------------------
           APPLY TRANSLATIONS
        ------------------------------------------------------- */
        document.getElementById('hdr-title').textContent = t.hdrTitle;
        document.getElementById('hdr-sub').textContent = t.hdrSub;
        document.getElementById('main-heading').textContent = t.mainHeading;
        document.getElementById('main-desc').textContent = t.mainDesc;
        document.querySelector('.lbl-1').textContent = t.l1;
        document.querySelector('.lbl-2').textContent = t.l2;
        document.querySelector('.lbl-3').textContent = t.l3;
        document.querySelector('.lbl-4').textContent = t.l4;
        document.querySelector('.lbl-5').textContent = t.l5;
        document.getElementById('lbl-comment').textContent = t.lblComment;
        document.getElementById('user-comment').placeholder = t.commentPlaceholder;
        document.getElementById('record-status').textContent = t.recStatus;
        document.getElementById('btn-back').textContent = t.btnBack;
        document.getElementById('btn-submit').textContent = t.btnSubmit;
        document.getElementById('success-title-text').textContent = t.successTitle;
        document.getElementById('success-msg-text').textContent = t.successDesc;

        /* -------------------------------------------------------
           THEME TOGGLE
        ------------------------------------------------------- */
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');

            body.classList.toggle('light-mode');

            if (body.classList.contains('light-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                text.textContent = 'Light Mode';
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                text.textContent = 'Dark Mode';
            }
        }

        /* -------------------------------------------------------
           RATING SELECTION
        ------------------------------------------------------- */
        let selectedScore = '';

        function selectRating(score) {
            selectedScore = String(score);

            for (let i = 1; i <= 5; i++) {
                const card = document.getElementById(`rate-${i}`);
                if (card) {
                    card.classList.remove('selected');
                }
            }

            const selectedCard = document.getElementById(`rate-${selectedScore}`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }

            document.getElementById('alert-box').classList.add('hidden');
        }

        /* -------------------------------------------------------
           ENGLISH VOICE GUIDE
        ------------------------------------------------------- */
        function readFullUIEnglish() {
            if (!('speechSynthesis' in window)) {
                alert("Your browser does not support text-to-speech synthesis.");
                return;
            }

            window.speechSynthesis.cancel();

            const enTrans = translations.en;

            const speechText = `
                Welcome to ${enTrans.hdrTitle}, ${enTrans.hdrSub}.
                Question: ${enTrans.mainHeading}.
                Instructions: ${enTrans.mainDesc}.
                The available rating choices are:
                Option 1: ${enTrans.l1}.
                Option 2: ${enTrans.l2}.
                Option 3: ${enTrans.l3}.
                Option 4: ${enTrans.l4}.
                Option 5: ${enTrans.l5}.
                Feedback field: ${enTrans.lblComment}.
                You can also click the microphone button to record your voice feedback.
                Action buttons: Click ${enTrans.btnSubmit} to submit,
                or click ${enTrans.btnBack} to return.
            `;

            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = 'en-US';
            utterance.rate = 0.92;
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        /* -------------------------------------------------------
           SPEECH-TO-TEXT
        ------------------------------------------------------- */
        const micBtn = document.getElementById('record-btn');
        const micIcon = document.getElementById('mic-icon');
        const recordStatus = document.getElementById('record-status');
        const commentInput = document.getElementById('user-comment');

        if (micBtn && commentInput) {
            const SpeechRecognition =
                window.SpeechRecognition || window.webkitSpeechRecognition;

            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();

                recognition.lang =
                    lang === 'am'
                        ? 'am-ET'
                                : lang === 'en'
                                ? 'en-US'
                                : 'en-US';

                recognition.continuous = false;
                recognition.interimResults = true;

                let finalTranscript = '';

                micBtn.addEventListener('click', () => {
                    try {
                        finalTranscript = '';
                        recognition.start();
                    } catch (error) {
                        console.log("Recognition already active:", error);
                    }
                });

                recognition.onstart = () => {
                    recordStatus.textContent = t.recActive;
                    micBtn.classList.add('recording-active');

                    micIcon.classList.remove(
                        'fa-microphone',
                        'text-amber-400'
                    );

                    micIcon.classList.add(
                        'fa-stop',
                        'text-white'
                    );
                };

                recognition.onresult = (event) => {
                    let interim = '';

                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i++
                    ) {
                        if (event.results[i].isFinal) {
                            finalTranscript +=
                                event.results[i][0].transcript;
                        } else {
                            interim +=
                                event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        commentInput.value = commentInput.value
                            ? `${commentInput.value} ${finalTranscript}`
                            : finalTranscript;
                    }
                };

                recognition.onerror = (event) => {
                    console.error(
                        "Speech recognition error:",
                        event.error
                    );
                    resetMicButton();
                };

                recognition.onend = () => {
                    resetMicButton();
                };

                function resetMicButton() {
                    recordStatus.textContent = t.recStatus;

                    micBtn.classList.remove('recording-active');

                    micIcon.classList.remove(
                        'fa-stop',
                        'text-white'
                    );

                    micIcon.classList.add(
                        'fa-microphone',
                        'text-amber-400'
                    );
                }
            } else {
                micBtn.style.display = 'none';
            }
        }

        /* -------------------------------------------------------
           BACKEND gTTS VOICE GUIDE
        ------------------------------------------------------- */
        async function playGttsGuide(text, langCode) {
            try {
                const response = await fetch('/text-to-speech', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        lang: langCode
                    })
                });

                if (!response.ok) {
                    throw new Error(
                        'Failed to generate audio via gTTS.'
                    );
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);

                audio.addEventListener(
                    'ended',
                    () => URL.revokeObjectURL(audioUrl),
                    { once: true }
                );

                await audio.play();
            } catch (error) {
                console.error("gTTS Error:", error);
            }
        }

            const hasNegative = negativeKeywords.some(

            if (

            ) {

                );

                    );

        /* -------------------------------------------------------
           NAVIGATION BACK
        ------------------------------------------------------- */
        function goBack() {
            const targetLanguage =
                encodeURIComponent(lang || 'am');

            window.location.href =
                `/?lang=${targetLanguage}`;
        }
