<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Police - Service Categories & Sub-services</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #172554, #0f172a, #020617);
            --text-main: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.94);
            --glass-border: rgba(251, 191, 36, 0.35);
            --card-bg: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.98));
            --card-border: rgba(255, 255, 255, 0.12);
            --card-hover-bg: linear-gradient(145deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.99));
            --subcard-hover-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.5), rgba(15, 23, 42, 0.99));
            --audio-bg: rgba(15, 23, 42, 0.6);
        }

        body.light-mode {
            --bg-gradient: radial-gradient(circle at center, #6cb0f5, #e2e8f0, #cbd5e1);
            --text-main: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(217, 119, 6, 0.4);
            --card-bg: linear-gradient(145deg, #ffffff, #f1f5f9);
            --card-border: rgba(0, 0, 0, 0.1);
            --card-hover-bg: linear-gradient(145deg, #e0f2fe, #f0f9ff);
            --subcard-hover-bg: linear-gradient(145deg, #dbeafe, #eff6ff);
            --audio-bg: rgba(241, 245, 249, 0.8);
        }

        body {
            font-family: 'Montserrat', 'Noto Sans Ethiopic', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            padding: 24px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.3);
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #d97706;
            box-shadow: 0 20px 35px -10px rgba(217, 119, 6, 0.3);
            background: var(--card-hover-bg);
        }

        .sub-service-grid-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .sub-service-grid-item:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: #d97706;
            box-shadow: 0 25px 50px -10px rgba(217, 119, 6, 0.3);
            background: var(--subcard-hover-bg);
        }

        .voice-btn {
            background: rgba(217, 119, 6, 0.15);
            border: 1px solid rgba(217, 119, 6, 0.4);
            color: #d97706;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .voice-btn:hover { background: rgba(217, 119, 6, 0.3); }
    </style>
</head>
<body id="body-wrapper">

    <div class="text-center mt-2">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-amber-500 mb-1">Ethiopian Federal Police</h1>
        <p class="text-lg md:text-xl font-semibold opacity-90 mb-2">How was your experience today?</p>
        <div class="text-amber-400 text-2xl space-x-1">
            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
        </div>
    </div>

    <div class="glass-panel p-6 md:p-8 rounded-3xl w-full max-w-4xl my-4 relative">
        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="absolute top-4 right-4 bg-slate-800 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 cursor-pointer shadow">
            <i class="fa-solid fa-moon" id="theme-icon"></i> <span id="theme-text">Dark Mode</span>
        </button>

        <!-- Main Categories View -->
        <div id="main-categories-view" class="pt-4">
            <h2 class="text-xl md:text-2xl font-bold mb-6 text-center text-amber-500 tracking-wide">
                Please choose the service category
            </h2>
            <div id="main-categories-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamically loaded from PostgreSQL -->
                <div class="col-span-2 text-center py-8 text-amber-500/70 animate-pulse">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p class="text-sm">Connecting to PostgreSQL database...</p>
                </div>
            </div>
        </div>

        <!-- Sub-Services View -->
        <div id="sub-services-view" class="hidden pt-4">
            <div class="flex items-center justify-between mb-5 border-b border-amber-500/20 pb-3 pr-28">
                <button onclick="backToCategories()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 px-4 py-2 rounded-xl border border-amber-500/40 text-xs font-semibold flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i> <span>Back to Categories</span>
                </button>
                <h3 id="sub-category-heading" class="text-lg md:text-xl font-extrabold text-amber-500 tracking-wide">Sub-Services</h3>
            </div>
            <div id="sub-services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- Audio Assistance -->
        <div class="mt-8 pt-5 border-t border-amber-500/20 rounded-2xl p-4" style="background: var(--audio-bg);">
            <p class="text-[11px] text-amber-500 font-bold uppercase tracking-wider text-center mb-3">Audio Assistance / የድምጽ እርዳታ</p>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <button onclick="playVoiceGuide('Please choose the service category you would like to rate today.', 'en')" class="voice-btn">🔊 English Guide</button>
                <button onclick="playVoiceGuide('እባክዎ ሊገመግሙት የሚፈልጉትን ዋና አገልግሎት ይምረጡ።', 'am')" class="voice-btn">🔊 አማርኛ መመሪያ</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-4xl flex justify-between items-center px-2">
        <button onclick="goBack()" class="service-card font-semibold px-5 py-2.5 rounded-xl flex items-center space-x-2 text-sm">
            <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
        </button>
        <div class="text-xs opacity-60 tracking-wider uppercase font-medium">Federal Police Kiosk v4.5</div>
    </div>

    <script>
        let departmentsData = {};
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'en';

        async function fetchDepartmentsFromPSQL() {
            try {
                const response = await fetch('/api/departments');
                if (!response.ok) throw new Error('Network response was not ok');
                departmentsData = await response.json();
                renderMainCategories();
            } catch (error) {
                console.error('Failed to load from PostgreSQL:', error);
                document.getElementById('main-categories-container').innerHTML = `
                    <div class="col-span-2 text-center py-6 text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p class="text-sm font-bold">Could not load categories from PostgreSQL database.</p>
                        <p class="text-xs opacity-70 mt-1">Check your Flask terminal for database connection logs.</p>
                    </div>
                `;
            }
        }

        function renderMainCategories() {
            const container = document.getElementById('main-categories-container');
            container.innerHTML = "";

            if (Object.keys(departmentsData).length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-6 text-amber-400">No records found in database tables.</div>`;
                return;
            }

            for (const [key, catData] of Object.entries(departmentsData)) {
                let catName = catData.title[currentLang] || catData.title['en'];
                let catDesc = catData.description ? (catData.description[currentLang] || catData.description['en']) : "";

                const card = document.createElement('div');
                card.className = "service-card p-4 rounded-2xl flex items-center space-x-4 group";
                card.onclick = () => showSubServices(key);

                card.innerHTML = `
                    <div class="w-13 h-13 rounded-xl bg-blue-600/30 flex items-center justify-center text-amber-500 text-xl group-hover:bg-amber-500 group-hover:text-slate-900 transition-all duration-300 flex-shrink-0">
                        <i class="fa-solid ${catData.icon || 'fa-folder'}"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-base font-bold group-hover:text-amber-500 transition-colors">${catName}</h3>
                        <p class="text-xs opacity-70 mt-0.5">${catDesc}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right opacity-50 group-hover:text-amber-500 transition-transform group-hover:translate-x-1"></i>
                `;
                container.appendChild(card);
            }
        }

        function showSubServices(categoryKey) {
            const catData = departmentsData[categoryKey];
            if (!catData) return;

            document.getElementById('sub-category-heading').innerText = catData.title[currentLang] || catData.title['en'];
            const container = document.getElementById('sub-services-container');
            container.innerHTML = "";

            catData.items.forEach((sub) => {
                let subName = sub.name[currentLang] || sub.name['en'];
                const card = document.createElement('div');
                card.className = "sub-service-grid-item p-4 rounded-2xl flex items-center space-x-4 group";
                card.onclick = () => window.location.href = `/feedback?service=${categoryKey}&sub_service=${sub.id}&lang=${currentLang}`;

                card.innerHTML = `
                    <div class="w-13 h-13 rounded-xl bg-blue-600/30 flex items-center justify-center text-amber-500 text-xl group-hover:bg-amber-500 group-hover:text-slate-900 transition-all duration-300 flex-shrink-0">
                        <i class="fa-solid ${sub.icon}"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-base font-bold group-hover:text-amber-500 transition-colors">${subName}</h4>
                        <p class="text-xs opacity-70 mt-0.5">Click to proceed with your rating</p>
                    </div>
                    <i class="fa-solid fa-chevron-right opacity-50 group-hover:text-amber-500 transition-transform group-hover:translate-x-1"></i>
                `;
                container.appendChild(card);
            });

            document.getElementById('main-categories-view').classList.add('hidden');
            document.getElementById('sub-services-view').classList.remove('hidden');
        }

        function backToCategories() {
            document.getElementById('sub-services-view').classList.add('hidden');
            document.getElementById('main-categories-view').classList.remove('hidden');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('theme-icon').className = isLight ? "fa-solid fa-sun text-amber-500" : "fa-solid fa-moon text-amber-400";
            document.getElementById('theme-text').innerText = isLight ? "Light Mode" : "Dark Mode";
        }

        function playVoiceGuide(text, langCode) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode === 'am' ? 'am-ET' : 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function goBack() {
            if (!document.getElementById('sub-services-view').classList.contains('hidden')) {
                backToCategories();
            } else {
                window.history.back();
            }
        }

        // Run fetch on page load
        fetchDepartmentsFromPSQL();
    </script>
</body>
</html>
