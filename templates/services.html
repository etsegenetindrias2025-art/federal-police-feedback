<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Police - Service Categories & Sub-services</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #172554, #0f172a, #020617);
            --text-main: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.94);
            --glass-border: rgba(251, 191, 36, 0.35);
            --card-bg: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.98));
            --card-border: rgba(255, 255, 255, 0.12);
            --card-hover-bg: linear-gradient(145deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.99));
            --subcard-hover-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.5), rgba(15, 23, 42, 0.99));
            --audio-bg: rgba(15, 23, 42, 0.6);
        }

        body.light-mode {
            --bg-gradient: radial-gradient(circle at center, #6cb0f5, #e2e8f0, #cbd5e1);
            --text-main: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(217, 119, 6, 0.4);
            --card-bg: linear-gradient(145deg, #ffffff, #f1f5f9);
            --card-border: rgba(0, 0, 0, 0.1);
            --card-hover-bg: linear-gradient(145deg, #e0f2fe, #f0f9ff);
            --subcard-hover-bg: linear-gradient(145deg, #dbeafe, #eff6ff);
            --audio-bg: rgba(241, 245, 249, 0.8);
        }

        body {
            font-family: 'Montserrat', 'Noto Sans Ethiopic', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            padding: 24px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.3);
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #d97706;
            box-shadow: 0 20px 35px -10px rgba(217, 119, 6, 0.3);
            background: var(--card-hover-bg);
        }

        .sub-service-grid-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .sub-service-grid-item:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: #d97706;
            box-shadow: 0 25px 50px -10px rgba(217, 119, 6, 0.3);
            background: var(--subcard-hover-bg);
        }

        .voice-btn {
            background: rgba(217, 119, 6, 0.15);
            border: 1px solid rgba(217, 119, 6, 0.4);
            color: #d97706;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .voice-btn:hover { background: rgba(217, 119, 6, 0.3); }
    </style>
</head>
<body id="body-wrapper">

    <div class="text-center mt-2">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-amber-500 mb-1" data-i18n="orgName">የኢትዮጵያ ፌዴራል ፖሊስ</h1>
        <p class="text-lg md:text-xl font-semibold opacity-90 mb-2" data-i18n="subtitle">ዛሬ አገልግሎታችን እንዴት ነበር?</p>
        <div class="text-amber-400 text-2xl space-x-1">
            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
        </div>
    </div>

    <div class="glass-panel p-6 md:p-8 rounded-3xl w-full max-w-4xl my-4 relative">
        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="absolute top-4 right-4 bg-slate-800 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 cursor-pointer shadow">
            <i class="fa-solid fa-moon" id="theme-icon"></i> <span id="theme-text">ጨለማ ሁነታ</span>
        </button>

        <!-- Main Categories View -->
        <div id="main-categories-view" class="pt-4">
            <h2 class="text-xl md:text-2xl font-bold mb-6 text-center text-amber-500 tracking-wide" data-i18n="chooseCategory">
                እባክዎ የአገልግሎት ምድብ ይምረጡ
            </h2>
            <div id="main-categories-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-2 text-center py-8 text-amber-500/70 animate-pulse">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p class="text-sm" data-i18n="loading">መረጃ በመጫን ላይ...</p>
                </div>
            </div>

            <!-- Custom Service Request Box -->
            <div id="custom-request-box" class="mt-6 p-5 rounded-2xl border border-amber-500/30 bg-slate-900/60 backdrop-blur-md">
                <h4 class="text-sm font-bold text-amber-400 mb-2" data-i18n="unlistedTitle">የሚፈልጉትን አገልግሎት አላገኙም?</h4>
                <p class="text-xs opacity-75 mb-3" data-i18n="unlistedDesc">ከላይ ባለው ዝርዝር ውስጥ የሚፈልጉትን አገልግሎት ካላገኙ፣ እባክዎ የሚፈልጉትን አገልግሎት ወይም ጥያቄ እዚህ ይጻፉ።</p>

                <div class="mb-4">
                    <textarea id="customServiceInput" rows="4" class="w-full bg-slate-950/80 border border-amber-500/40 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400 resize-none" data-i18n-placeholder="unlistedPlaceholder" placeholder="እባክዎ የሚፈልጉትን አገልግሎት ወይም ጥያቄ እዚህ ይጻፉ..."></textarea>
                </div>

                <!-- Success Alert Box -->
                <div id="success-alert" class="hidden mt-3 p-3.5 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-300 text-xs font-bold text-center flex items-center justify-center space-x-2 shadow-lg transition-all duration-500">
                    <i class="fa-solid fa-circle-check text-base"></i>
                    <span id="success-msg-text" data-i18n="successMsg">መልእክቱ ተልኳል! አገልግሎቱን ስለተጠቀሙ እናመሰግናለን።</span>
                </div>

                <div class="mt-3 text-right">
                    <button type="button" onclick="submitCustomServiceRequest()" class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold px-6 py-2 rounded-xl text-xs shadow-lg transition-all duration-300 cursor-pointer" data-i18n="submitRequest">
                        ጥያቄ ላክ
                    </button>
                </div>
            </div>
        </div>

        <!-- Sub-Services View -->
        <div id="sub-services-view" class="hidden pt-4">
            <div class="flex items-center justify-between mb-5 border-b border-amber-500/20 pb-3 pr-28">
                <button onclick="backToCategories()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 px-4 py-2 rounded-xl border border-amber-500/40 text-xs font-semibold flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i> <span data-i18n="backToCategories">ወደ ምድቦች ተመለስ</span>
                </button>
                <h3 id="sub-category-heading" class="text-lg md:text-xl font-extrabold text-amber-500 tracking-wide" data-i18n="subServices">ንዑስ አገልግሎቶች</h3>
            </div>
            <div id="sub-services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- Audio Assistance -->
        <div class="mt-8 pt-5 border-t border-amber-500/20 rounded-2xl p-4" style="background: var(--audio-bg);">
            <p class="text-[11px] text-amber-500 font-bold uppercase tracking-wider text-center mb-3" data-i18n="audioAssistance">የድምጽ እርዳታ</p>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <button onclick="playVoiceGuide('Please choose the service category you would like to rate today.', 'en')" class="voice-btn">🔊 <span data-i18n="englishGuide">የእንግሊዝኛ መመሪያ</span></button>
                <button onclick="playVoiceGuide('እባክዎ ሊገመግሙት የሚፈልጉትን ዋና አገልግሎት ይምረጡ።', 'am')" class="voice-btn">🔊 <span data-i18n="amharicGuide">አማርኛ መመሪያ</span></button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-4xl flex justify-between items-center px-2">
        <button onclick="goBack()" class="service-card font-semibold px-5 py-2.5 rounded-xl flex items-center space-x-2 text-sm">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="back">ተመለስ</span>
        </button>
        <div class="text-xs opacity-60 tracking-wider uppercase font-medium" data-i18n="footer">የፌዴራል ፖሊስ ኪዮስክ v4.5</div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <div id="toast-message" class="bg-slate-900 border border-amber-500 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-bold"></div>
    </div>

    <script>
        let departmentsData = {};
        let selectedCategoryKey = '';
        const urlParams = new URLSearchParams(window.location.search);
        // Amharic is the default, same as the Flask routes
        const currentLang = (urlParams.get('lang') === 'en') ? 'en' : 'am';

        // ------------------------------------------------------------
        // ALL PAGE TEXT, IN BOTH LANGUAGES
        // ------------------------------------------------------------
        const I18N = {
            am: {
                orgName: 'የኢትዮጵያ ፌዴራል ፖሊስ',
                subtitle: 'ዛሬ አገልግሎታችን እንዴት ነበር?',
                chooseCategory: 'እባክዎ የአገልግሎት ምድብ ይምረጡ',
                loading: 'መረጃ በመጫን ላይ...',
                unlistedTitle: 'የሚፈልጉትን አገልግሎት አላገኙም?',
                unlistedDesc: 'ከላይ ባለው ዝርዝር ውስጥ የሚፈልጉትን አገልግሎት ካላገኙ፣ እባክዎ የሚፈልጉትን አገልግሎት ወይም ጥያቄ እዚህ ይጻፉ።',
                unlistedPlaceholder: 'እባክዎ የሚፈልጉትን አገልግሎት ወይም ጥያቄ እዚህ ይጻፉ...',
                submitRequest: 'ጥያቄ ላክ',
                successMsg: 'መልእክቱ ተልኳል! አገልግሎቱን ስለተጠቀሙ እናመሰግናለን።',
                toastMsg: 'መልእክቱ በተሳካ ሁኔታ ተልኳል!',
                emptyMsg: 'እባክዎ መጀመሪያ የሚፈልጉትን ጥያቄ ወይም አገልግሎት ይጻፉ።',
                errorMsg: 'ስህተት ተፈጥሯል።',
                backToCategories: 'ወደ ምድቦች ተመለስ',
                subServices: 'ንዑስ አገልግሎቶች',
                clickToProceed: 'ደረጃ ለመስጠት ይጫኑ',
                audioAssistance: 'የድምጽ እርዳታ',
                englishGuide: 'የእንግሊዝኛ መመሪያ',
                amharicGuide: 'አማርኛ መመሪያ',
                back: 'ተመለስ',
                footer: 'የፌዴራል ፖሊስ ኪዮስክ v4.5',
                darkMode: 'ጨለማ ሁነታ',
                lightMode: 'ብሩህ ሁነታ',
                offlineTitle: 'ከመስመር ውጭ ነዎት ወይም አገልግሎቱ አይገኝም።',
                offlineDesc: 'እባክዎ የኢንተርኔት ግንኙነትዎን ያረጋግጡ።',
                noRecords: 'በዳታቤዝ ውስጥ ምንም መዝገብ አልተገኘም።'
            },
            en: {
                orgName: 'Ethiopian Federal Police',
                subtitle: 'How was your experience today?',
                chooseCategory: 'Please choose the service category',
                loading: 'Loading data...',
                unlistedTitle: 'Did you not find the service you need?',
                unlistedDesc: 'If you did not get the service you are looking for from the list above, please write the service or request you need here.',
                unlistedPlaceholder: 'Please write the service or request you need here...',
                submitRequest: 'Submit Request',
                successMsg: 'Your message has been sent! Thank you for using our service.',
                toastMsg: 'Request submitted successfully!',
                emptyMsg: 'Please enter your request or comment first.',
                errorMsg: 'An error occurred.',
                backToCategories: 'Back to Categories',
                subServices: 'Sub-Services',
                clickToProceed: 'Click to proceed with your rating',
                audioAssistance: 'AUDIO ASSISTANCE',
                englishGuide: 'English Guide',
                amharicGuide: 'Amharic Guide',
                back: 'Back',
                footer: 'Federal Police Kiosk v4.5',
                darkMode: 'Dark Mode',
                lightMode: 'Light Mode',
                offlineTitle: 'You are offline or the endpoint is unavailable.',
                offlineDesc: 'Please check your network connection or service worker setup.',
                noRecords: 'No records found in database tables.'
            }
        };

        const t = I18N[currentLang];

        // Fills every element that has data-i18n / data-i18n-placeholder
        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key] !== undefined) el.placeholder = t[key];
            });
            document.getElementById('theme-text').innerText =
                document.body.classList.contains('light-mode') ? t.lightMode : t.darkMode;
        }

        function showToast(message) {
            const toast = document.getElementById('toast-container');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        async function fetchDepartmentsFromPSQL() {
            try {
                const response = await fetch('/api/departments');
                if (!response.ok) throw new Error('Network response was not ok');

                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    departmentsData = await response.json();
                    renderMainCategories();
                } else {
                    throw new TypeError("Received offline fallback HTML instead of JSON data.");
                }
            } catch (error) {
                console.warn('Failed to load from PostgreSQL or offline fallback triggered:', error);
                document.getElementById('main-categories-container').innerHTML = `
                    <div class="col-span-2 text-center py-6 text-amber-400">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p class="text-sm font-bold">${t.offlineTitle}</p>
                        <p class="text-xs opacity-70 mt-1">${t.offlineDesc}</p>
                    </div>
                `;
            }
        }

        function renderMainCategories() {
            const container = document.getElementById('main-categories-container');
            container.innerHTML = "";

            if (Object.keys(departmentsData).length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-6 text-amber-400">${t.noRecords}</div>`;
                return;
            }

            for (const [key, catData] of Object.entries(departmentsData)) {
                let catName = catData.title[currentLang] || catData.title['en'];
                let catDesc = catData.description ? (catData.description[currentLang] || catData.description['en']) : "";

                const card = document.createElement('div');
                card.className = "service-card p-4 rounded-2xl flex items-center space-x-4 group";
                card.onclick = () => showSubServices(key);

                card.innerHTML = `
                    <div class="w-13 h-13 rounded-xl bg-blue-600/30 flex items-center justify-center text-amber-500 text-xl group-hover:bg-amber-500 group-hover:text-slate-900 transition-all duration-300 flex-shrink-0">
                        <i class="fa-solid ${catData.icon || 'fa-folder'}"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-base font-bold group-hover:text-amber-500 transition-colors">${catName}</h3>
                        <p class="text-xs opacity-70 mt-0.5">${catDesc}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right opacity-50 group-hover:text-amber-500 transition-transform group-hover:translate-x-1"></i>
                `;
                container.appendChild(card);
            }
        }

        function showSubServices(categoryKey) {
            selectedCategoryKey = categoryKey;
            const catData = departmentsData[categoryKey];
            if (!catData) return;

            const heading = document.getElementById('sub-category-heading');
            heading.removeAttribute('data-i18n');
            heading.innerText = catData.title[currentLang] || catData.title['en'];

            const container = document.getElementById('sub-services-container');
            container.innerHTML = "";

            catData.items.forEach((sub) => {
                let subName = sub.name[currentLang] || sub.name['en'];
                const card = document.createElement('div');
                card.className = "sub-service-grid-item p-4 rounded-2xl flex items-center space-x-4 group";
                card.onclick = () => window.location.href = `/feedback?service=${categoryKey}&sub_service=${sub.id}&lang=${currentLang}`;

                card.innerHTML = `
                    <div class="w-13 h-13 rounded-xl bg-blue-600/30 flex items-center justify-center text-amber-500 text-xl group-hover:bg-amber-500 group-hover:text-slate-900 transition-all duration-300 flex-shrink-0">
                        <i class="fa-solid ${sub.icon}"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-base font-bold group-hover:text-amber-500 transition-colors">${subName}</h4>
                        <p class="text-xs opacity-70 mt-0.5">${t.clickToProceed}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right opacity-50 group-hover:text-amber-500 transition-transform group-hover:translate-x-1"></i>
                `;
                container.appendChild(card);
            });

            document.getElementById('main-categories-view').classList.add('hidden');
            document.getElementById('sub-services-view').classList.remove('hidden');
        }

        function backToCategories() {
            document.getElementById('sub-services-view').classList.add('hidden');
            document.getElementById('main-categories-view').classList.remove('hidden');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('theme-icon').className = isLight ? "fa-solid fa-sun text-amber-500" : "fa-solid fa-moon text-amber-400";
            document.getElementById('theme-text').innerText = isLight ? t.lightMode : t.darkMode;
        }

        function playVoiceGuide(text, langCode) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode === 'am' ? 'am-ET' : 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function goBack() {
            if (!document.getElementById('sub-services-view').classList.contains('hidden')) {
                backToCategories();
            } else {
                window.history.back();
            }
        }

        function submitCustomServiceRequest() {
            const reqText = document.getElementById('customServiceInput').value.trim();
            const successAlert = document.getElementById('success-alert');

            if (!reqText) {
                showToast(t.emptyMsg);
                return;
            }

            fetch('/submit-feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    service: 'additional_request',
                    sub_service: 'unlisted_comment',
                    rating: '😊',
                    comment: reqText,
                    unlisted_service: reqText,
                    timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    successAlert.classList.remove('hidden');
                    showToast(t.toastMsg);
                    document.getElementById('customServiceInput').value = '';

                    // Stay on the citizen side: hide the message, then go back
                    // to the start of the kiosk flow (fingerprint page).
                    setTimeout(() => {
                        successAlert.classList.add('hidden');
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showToast(data.message || t.errorMsg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                showToast(t.errorMsg);
            });
        }

        applyTranslations();
        fetchDepartmentsFromPSQL();
    </script>
</body>
</html>
