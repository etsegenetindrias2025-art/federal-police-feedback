<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiopian Federal Police - Citizen Feedback System</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #0f172a, #090d16, #020408);
            --card-bg: rgba(15, 23, 42, 0.95);
            --card-border: rgba(251, 191, 36, 0.4);
            --card-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(251, 191, 36, 0.1);
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --header-border: #1e293b;
            --lang-card-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            --lang-card-border: rgba(251, 191, 36, 0.3);
            --lang-card-hover: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(251, 191, 36, 0.18));
            --lang-text-main: #fbbf24;
            --lang-text-sub: #cbd5e1;
            --default-card-bg: rgba(251, 191, 36, 0.15);
            --default-card-border: rgba(251, 191, 36, 0.6);
            --section-box-bg: rgba(15, 23, 42, 0.6);
            --section-box-border: #1e293b;
            --theme-btn-bg: rgba(255, 255, 255, 0.1);
            --theme-btn-text: #fbbf24;
            --theme-btn-border: rgba(251, 191, 36, 0.4);
            --voice-btn-bg: rgba(251, 191, 36, 0.1);
            --voice-btn-border: rgba(251, 191, 36, 0.3);
            --voice-btn-text: #fbbf24;
            --title-color-start: #fff7ed;
            --title-color-mid: #fbbf24;
            --title-color-end: #b45309;
            --title-drop-shadow: rgba(251, 191, 36, 0.4);
            --subtitle-color: #f59e0b;
        }

        body.light-theme {
            --bg-gradient: linear-gradient(135deg, #fbfdff 0%, #f2f6fc 100%);
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            --text-main: #0f172a;
            --text-sub: #475569;
            --header-border: #f1f5f9;
            --lang-card-bg: #ffffff;
            --lang-card-border: #e2e8f0;
            --lang-card-hover: linear-gradient(135deg, #fffbeb, #fef3c7);
            --lang-text-main: #1e293b;
            --lang-text-sub: #64748b;
            --default-card-bg: #fef3c7;
            --default-card-border: #f59e0b;
            --section-box-bg: #f8fafc;
            --section-box-border: #e2e8f0;
            --theme-btn-bg: #f1f5f9;
            --theme-btn-text: #d97706;
            --theme-btn-border: #cbd5e1;
            --voice-btn-bg: #ffffff;
            --voice-btn-border: #cbd5e1;
            --voice-btn-text: #334155;
            --title-color-start: #0f172a;
            --title-color-mid: #1e293b;
            --title-color-end: #b45309;
            --title-drop-shadow: rgba(180, 83, 9, 0.15);
            --subtitle-color: #b45309;
        }

        body {
            font-family: 'Montserrat', 'Noto Sans Ethiopic', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease, color 0.4s ease;
            box-sizing: border-box;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 768px;
            padding: 30px;
            border-radius: 24px;
            position: relative;
            box-sizing: border-box;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .theme-btn-container {
            position: absolute;
            top: 24px;
            right: 24px;
        }

        .theme-toggle-btn {
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-btn-border);
            color: var(--theme-btn-text);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--header-border);
            padding-top: 10px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 16px auto;
            display: block;
        }

        .header-title {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            background: linear-gradient(to bottom, var(--title-color-start) 0%, var(--title-color-mid) 50%, var(--title-color-end) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 4px 0;
            filter: drop-shadow(0 4px 12px var(--title-drop-shadow));
        }

        .header-subtitle {
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--subtitle-color);
            margin: 0;
        }

        .instruction-text {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            text-transform: uppercase;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 540px) {
            .lang-grid {
                grid-template-columns: 1fr;
            }
        }

        .lang-card {
            background: var(--lang-card-bg);
            border: 1px solid var(--lang-card-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.35s ease;
        }

        .lang-card-default {
            background: var(--default-card-bg) !important;
            border-color: var(--default-card-border) !important;
        }

        .lang-card:hover {
            transform: translateY(-4px);
            border-color: #fbbf24;
            background: var(--lang-card-hover);
            box-shadow: 0 12px 24px rgba(251, 191, 36, 0.2);
        }

        .lang-card .main-lbl {
            font-weight: 700;
            font-size: 14px;
            color: var(--lang-text-main);
            display: block;
            margin-bottom: 2px;
        }

        .lang-card .sub-lbl {
            font-size: 11px;
            color: var(--lang-text-sub);
        }

        .voice-section {
            background: var(--section-box-bg);
            border: 1px solid var(--section-box-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .voice-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 12px;
            color: var(--subtitle-color);
        }

        .voice-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .voice-btn {
            background: var(--voice-btn-bg);
            border: 1px solid var(--voice-btn-border);
            color: var(--voice-btn-text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .voice-btn:hover {
            background: rgba(251, 191, 36, 0.25);
            border-color: #fbbf24;
            transform: translateY(-2px);
        }

        .footer-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--header-border);
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="main-card">
        
        <div class="theme-btn-container">
            <button onclick="toggleTheme()" id="theme-toggle" class="theme-toggle-btn" type="button">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark Mode</span>
            </button>
        </div>

        <div class="header-section">
            <img src="{{ url_for('static', filename='images/police_logo.png') }}" alt="Federal Police Logo" class="logo-img" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/2/2b/Emblem_of_Ethiop3.png'">
            <h1 class="header-title">Ethiopian Federal Police</h1>
            <p class="header-subtitle">Citizen Feedback System</p>
        </div>

        <div>
            <p class="instruction-text">Please select your preferred language to begin :</p>

            <div class="lang-grid">
                <a href="{{ url_for('services', lang='en') }}" class="lang-card lang-card-default">
                    <span class="main-lbl" style="color: #fbbf24;">English</span>
                    <span class="sub-lbl">Default Language</span>
                </a>

                <a href="{{ url_for('services', lang='am') }}" class="lang-card">
                    <span class="main-lbl">አማርኛ</span>
                    <span class="sub-lbl">Amharic</span>
                </a>

                <a href="{{ url_for('services', lang='om') }}" class="lang-card">
                    <span class="main-lbl">Afaan Oromoo</span>
                    <span class="sub-lbl">Oromic</span>
                </a>

                <a href="{{ url_for('services', lang='ti') }}" class="lang-card">
                    <span class="main-lbl">ትግርኛ</span>
                    <span class="sub-lbl">Tigrigna</span>
                </a>
            </div>
        </div>

        <div class="voice-section">
            <p class="voice-title">Audio Assistance / የድምጽ እርዳታ</p>
            <div class="voice-buttons">
                <button onclick="readFullPageEnglish()" class="voice-btn" type="button">🔊 English</button>
                <button onclick="playVoiceGuide('እንኳን ወደ ኢትዮጵያ ፌዴራል ፖሊስ የህዝብ አስተያየት መስጫ ስርዓት በደህና መጡ።', 'am')" class="voice-btn" type="button">🔊 አማርኛ</button>
                <button onclick="playVoiceGuide('Baga nagaan dhuftan Sistema yaada kennisa Poolisii Federaalaa Itoophiyaa.', 'om')" class="voice-btn" type="button">🔊 Afaan Oromoo</button>
                <button onclick="playVoiceGuide('ናብ ስርዓት ርእይቶ ህዝቢ ፌደራል ፖሊስ ኢትዮጵያ ብሰላም መጻእኩም።', 'ti')" class="voice-btn" type="button">🔊 ትግርኛ</button>
            </div>
        </div>

        <div class="footer-section">
            <span>Ethiopian Federal Police &copy; 2026</span>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('welcome-theme');
            if (savedTheme === 'light') {
                applyLightTheme();
            }
        });

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-theme');
            if (isLight) {
                applyDarkTheme();
            } else {
                applyLightTheme();
            }
        }

        function applyLightTheme() {
            document.body.classList.add('light-theme');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
            document.getElementById('theme-text').innerText = 'Light Mode';
            localStorage.setItem('welcome-theme', 'light');
        }

        function applyDarkTheme() {
            document.body.classList.remove('light-theme');
            document.getElementById('theme-icon').className = 'fa-solid fa-moon';
            document.getElementById('theme-text').innerText = 'Dark Mode';
            localStorage.setItem('welcome-theme', 'dark');
        }

        function playVoiceGuide(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'am' ? 'am-ET' : 
                                 (lang === 'om' ? 'om-ET' : 
                                 (lang === 'ti' ? 'ti-ER' : 'en-US'));
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function readFullPageEnglish() {
            const fullText = "Welcome to the Ethiopian Federal Police Citizen Feedback System. Please select your preferred language to begin.";
            playVoiceGuide(fullText, 'en');
        }
    </script>
</body>
</html>
