<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ethiopian Federal Police</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #05070b; color: #f3f4f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .login-card { background: #111827; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }

        .logo-img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 4px 10px rgba(56,189,248,0.3)); }

        h2 { font-size: 22px; color: #ffffff; font-weight: 700; margin-bottom: 5px; }
        .subtitle { font-size: 11px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 25px; }

        /* Notification Banner Style */
        .notification-banner { display: none; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; color: #38bdf8; font-size: 13px; }

        .error-msg { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; font-weight: 600; margin-bottom: 8px; }

        .form-control { width: 100%; background: #1a2234; border: 1px solid rgba(255,255,255,0.08); padding: 14px 16px; border-radius: 12px; color: #fff; font-size: 14px; transition: all 0.3s ease; outline: none; }
        .form-control:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); background: #1f2937; }

        .login-btn { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); margin-top: 10px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }

        .footer-note { margin-top: 25px; font-size: 11px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="{{ url_for('static', filename='images/police_logo.png') }}" class="logo-img" alt="Logo">
        <h2>Ethiopian Federal Police</h2>
        <div class="subtitle">Admin Control Dashboard</div>

        <!-- Real-time Unread Feedback Notification Banner -->
        <div id="login-notification-banner" class="notification-banner">
            🔔 There are <b id="unread-counter-num">0</b> new feedback submission(s) waiting for review.
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" autocomplete="off">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter admin password" required autocomplete="off">
            </div>

            <button type="submit" class="login-btn">Login to Dashboard</button>
        </form>

        <div class="footer-note">
            Authorized personnel only. All login attempts are monitored.
        </div>
    </div>

    <script>
        // Automatically check for unread feedback before logging in
        function checkUnreadNotifications() {
            fetch('/api/unread-count')
                .then(response => response.json())
                .then(data => {
                    const banner = document.getElementById('login-notification-banner');
                    if (data.unread_count > 0) {
                        document.getElementById('unread-counter-num').innerText = data.unread_count;
                        banner.style.display = 'block';
                    } else {
                        banner.style.display = 'none';
                    }
                })
                .catch(err => console.error('Error fetching unread count:', err));
        }

        // Run on page load and poll every 10 seconds
        checkUnreadNotifications();
        setInterval(checkUnreadNotifications, 10000);
    </script>

</body>
</html>
