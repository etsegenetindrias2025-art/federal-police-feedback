<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Ethiopian Federal Police</title>
    <link rel="stylesheet" href="/static/css">
    <style>
        .thank-you-container {
            text-align: center;
            padding: 50px 20px;
        }
        .success-icon {
            font-size: 60px;
            color: #c5a059;
            margin-bottom: 20px;
        }
        .thank-you-container h2 {
            color: #0d1b2a;
            margin-bottom: 15px;
        }
        .thank-you-container p {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Ethiopian Federal Police | የፌደራል ፖሊስ</h1>
        </div>
    </header>

    <div class="container">
        <div class="card thank-you-container">
            <div class="success-icon">✓</div>
            <h2>Thank You For Your Feedback!</h2>
            <p>Your submission has been successfully received. We appreciate you helping us improve our public safety and citizen services.</p>
            <a href="/" class="btn btn-gold">Return to Home</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Ethiopian Federal Police Citizen Satisfaction System. All Rights Reserved.</p>
    </footer>
</body>
</html>
